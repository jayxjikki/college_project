<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="maindiv">

        <h1>Attendance Calculator</h1>

        <div class="inputdiv">
            <label for="totalclassHTML">Total Classes held till now:</label>
            <input type="number" id="totalclassHTML">
            <label for="attendedclassHTML">Total Classes Attended:</label>
            <input type="number" id="attendedclassHTML">
            <label for="remainingclassHTML">Remaining Classes:</label>
            <input type="number" id="remainingclassHTML">
            <label for="targetattHTML">Target Attendance:</label>
            <input type="number" id="targetattHTML">
            <button id="calcBtnHTML">Calculate</button>
        </div>
        <div id="resultHTML">
            Result Section
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
